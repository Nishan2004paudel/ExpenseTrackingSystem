<main class="min-h-screen flex items-center justify-center px-4 py-8 bg-background">
  <div class="w-full max-w-[440px]">

    <div class="text-center mb-8">
      <div class="flex items-center justify-center gap-2 mb-2">
        <span class="material-symbols-outlined text-primary text-[28px]">account_balance_wallet</span>
        <span class="text-2xl font-bold text-on-background">HisabKitab</span>
      </div>
      <p class="text-on-surface-variant text-sm">Build a good habit.</p>
    </div>

    <div class="bg-surface-container-lowest border border-outline-variant rounded-xl shadow-lg p-6 md:p-8">

      <p *ngIf="justRegistered()"
        class="bg-primary-container text-on-primary-container text-sm rounded-lg px-4 py-3 mb-6 text-center">
        Account created! Please verify your email before logging in.
      </p>

      <p *ngIf="errorMessage()" class="text-error text-sm mb-4 text-center">{{ errorMessage() }}</p>

      <div class="mb-6">
        <app-google-button label="Continue with Google"></app-google-button>
      </div>

      <div class="flex items-center gap-4 mb-6">
        <div class="h-px flex-1 bg-outline-variant"></div>
        <span class="text-[10px] uppercase tracking-widest text-on-surface-variant">Or login with email</span>
        <div class="h-px flex-1 bg-outline-variant"></div>
      </div>

      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-6">
        <div class="space-y-1">
          <label class="block text-sm font-semibold text-on-surface-variant" for="identifier">Username or Email</label>
          <input id="identifier" formControlName="identifier" type="text" placeholder="Enter your email"
            class="w-full px-4 py-2 bg-surface border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary outline-none" />
        </div>

        <div class="space-y-1">
          <div class="flex justify-between items-center">
            <label class="block text-sm font-semibold text-on-surface-variant" for="password">Password</label>
            <a routerLink="/forgot-password" class="text-primary text-sm hover:underline">Forgot Password?</a>
          </div>
          <div class="relative">
            <input id="password" formControlName="password" [type]="showPassword() ? 'text' : 'password'"
              placeholder="••••••••"
              class="w-full px-4 py-2 pr-12 bg-surface border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary outline-none" />
            <button type="button" (click)="togglePassword()"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface">
              <span class="material-symbols-outlined text-[20px]">{{ showPassword() ? 'visibility_off' : 'visibility'
                }}</span>
            </button>
          </div>
        </div>

        <button type="submit" [disabled]="loading() || form.invalid"
          class="w-full bg-primary text-on-primary py-2 rounded-lg font-bold hover:opacity-90 transition-all disabled:opacity-50 disabled:cursor-not-allowed">
          {{ loading() ? 'Logging in...' : 'Login' }}
        </button>
      </form>

      <p class="text-center text-sm text-on-surface-variant mt-6">
        New to HisabKitab? <a routerLink="/register" class="text-primary font-bold hover:underline">Create Account</a>
      </p>
    </div>
  </div>
</main>
