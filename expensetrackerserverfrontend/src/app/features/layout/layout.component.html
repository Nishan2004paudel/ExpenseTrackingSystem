<div class="h-screen flex bg-background overflow-hidden">
  <aside class="w-64 shrink-0 h-screen bg-surface-container-lowest border-r border-outline-variant flex flex-col p-4">
    <div class="flex items-center gap-2 px-2 mb-6">
      <span class="material-symbols-outlined text-primary text-[24px]">account_balance_wallet</span>
      <span class="text-lg font-bold text-on-background">HisabKitab</span>
    </div>

    <nav class="flex-1 space-y-1 overflow-y-auto">
      <a routerLink="/dashboard" routerLinkActive="bg-primary-container text-on-primary-container font-semibold"
         class="flex items-center gap-3 px-3 py-2 rounded-lg text-on-surface-variant hover:bg-surface-container-low transition-colors">
        <span class="material-symbols-outlined text-[20px]">dashboard</span>
        Dashboard
      </a>
      <a routerLink="/profile" routerLinkActive="bg-primary-container text-on-primary-container font-semibold"
         class="flex items-center gap-3 px-3 py-2 rounded-lg text-on-surface-variant hover:bg-surface-container-low transition-colors">
        <span class="material-symbols-outlined text-[20px]">person</span>
        Profile
      </a>
      <a routerLink="/settings" routerLinkActive="bg-primary-container text-on-primary-container font-semibold"
         class="flex items-center gap-3 px-3 py-2 rounded-lg text-on-surface-variant hover:bg-surface-container-low transition-colors">
        <span class="material-symbols-outlined text-[20px]">settings</span>
        Settings
      </a>
    </nav>

    <div class="shrink-0 space-y-2 pt-2">
      <button type="button" class="w-full flex items-center justify-center gap-2 bg-primary text-on-primary py-2.5 rounded-lg font-bold hover:opacity-90 transition-all">
        <span class="material-symbols-outlined text-[18px]">add</span>
        Add Expense
      </button>

      <button type="button" class="w-full flex items-center gap-3 px-3 py-2 rounded-lg text-on-surface-variant hover:bg-surface-container-low transition-colors text-sm">
        <span class="material-symbols-outlined text-[18px]">help</span>
        Help Center
      </button>
    </div>
  </aside>

<main class="flex-1 h-screen flex flex-col overflow-hidden">
    <div class="shrink-0 flex justify-end items-center px-8 py-3 border-b border-outline-variant bg-surface-container-lowest">
      <button type="button" (click)="logout()"
              class="flex items-center gap-2 text-error text-sm font-semibold hover:underline">
        <span class="material-symbols-outlined text-[18px]">logout</span>
        Logout
      </button>
    </div>
    <div class="flex-1 min-h-0 p-6 flex justify-center overflow-hidden">
      <div class="w-full max-w-3xl h-full">
        <router-outlet></router-outlet>
      </div>
    </div>
  </main>
</div>
